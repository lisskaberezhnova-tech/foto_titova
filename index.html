<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR Photo Zone — Пионы</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var cam = params.get('camera') || 'back';
        var facingMode = cam === 'front' ? 'user' : 'environment';
        var original = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
        navigator.mediaDevices.getUserMedia = function(constraints) {
          if (constraints && constraints.video !== undefined && constraints.video !== false) {
            if (typeof constraints.video === 'object' && constraints.video !== null) {
              constraints.video.facingMode = facingMode;
            } else {
              constraints.video = { facingMode: facingMode };
            }
          }
          return original(constraints);
        };
      })();
    </script>

    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      canvas { display: block; width: 100% !important; height: 100% !important; }
      a-scene { width: 100vw !important; height: 100vh !important; display: block; margin: 0 auto; }

      /* Зеркало: переворачиваем только canvas (видео), AR-элементы компенсируем через 3D-масштаб */
      body.flip-scene a-scene { transform: scaleX(-1); }

      #hint {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.6); color: #fff; padding: 10px 18px;
        border-radius: 24px; font-family: -apple-system, sans-serif;
        font-size: 14px; z-index: 100; transition: opacity 0.5s;
        pointer-events: none; text-align: center;
      }
      #hint.hidden { opacity: 0; }

      #switch-cam {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        background: rgba(255,255,255,0.9); border: none;
        width: 56px; height: 56px; border-radius: 50%;
        z-index: 100; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        transition: all 0.2s; display: flex; align-items: center; justify-content: center;
      }
      #switch-cam:active { background: #fff; transform: translateX(-50%) scale(0.95); }
      #switch-cam svg { width: 28px; height: 28px; }

      #mirror-cam {
        position: fixed; bottom: 30px; right: 25px;
        background: rgba(255,255,255,0.9); border: none;
        width: 56px; height: 56px; border-radius: 50%;
        z-index: 100; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        transition: all 0.2s; display: none; align-items: center; justify-content: center;
      }
      #mirror-cam:active { background: #fff; transform: scale(0.95); }
      #mirror-cam svg { width: 28px; height: 28px; }

      /* Простой "+" вместо полос */
      #scan-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 90; pointer-events: none;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.4s;
      }
      #scan-overlay.hidden { opacity: 0; }
      #scan-plus {
        width: 50px; height: 50px; position: relative;
      }
      #scan-plus::before, #scan-plus::after {
        content: ''; position: absolute; background: rgba(255,255,255,0.5);
      }
      #scan-plus::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
      #scan-plus::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
    </style>
  </head>
  <body>
    <div id="hint">Наведите камеру на метку</div>
    <div id="scan-overlay"><div id="scan-plus"></div></div>

    <button id="switch-cam">
      <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path>
        <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"></path>
      </svg>
    </button>

    <button id="mirror-cam">
      <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v18"></path>
        <path d="M8 7L4 12l4 5"></path>
        <path d="M16 7l4 5-4 5"></path>
      </svg>
    </button>

    <a-scene
      mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 10; uiScanning: no; uiLoading: no; uiError: no;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights">

      <a-light type="ambient" intensity="0.7" color="#fff5f0"></a-light>
      <a-light type="directional" position="0 1 2" intensity="0.6" color="#ffffff"></a-light>
      <a-light type="point" position="0.5 0.5 1" intensity="0.25" color="#ffe8e8"></a-light>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target">
        <a-entity id="container">
          <a-image src="peony.png" id="p1" material="transparent: true; alphaTest: 0.05"
            position="0 0 0" rotation="0 0 0" scale="0.001 0.001 1" opacity="0"
            animation__grow="property: scale; from: 0.001 0.001 1; to: 1.05 1.05 1; dur: 3200; easing: easeOutCubic; startEvents: bloom"
            animation__fade="property: opacity; from: 0; to: 1; dur: 800; easing: easeOutCubic; startEvents: bloom"></a-image>
          <a-image src="peony.png" id="p2" material="transparent: true; alphaTest: 0.05"
            position="-0.38 0.72 0" rotation="0 5 0" scale="0.001 0.001 1" opacity="0"
            animation__grow="property: scale; from: 0.001 0.001 1; to: 0.65 0.65 1; dur: 2600; easing: easeOutCubic; startEvents: bloom"
            animation__fade="property: opacity; from: 0; to: 1; dur: 700; easing: easeOutCubic; startEvents: bloom"></a-image>
          <a-image src="peony.png" id="p3" material="transparent: true; alphaTest: 0.05"
            position="-0.36 -0.65 0" rotation="0 5 0" scale="0.001 0.001 1" opacity="0"
            animation__grow="property: scale; from: 0.001 0.001 1; to: 0.6 0.6 1; dur: 2400; easing: easeOutCubic; startEvents: bloom"
            animation__fade="property: opacity; from: 0; to: 1; dur: 650; easing: easeOutCubic; startEvents: bloom"></a-image>
          <a-image src="peony.png" id="p4" material="transparent: true; alphaTest: 0.05"
            position="0.4 0.75 0" rotation="0 -5 0" scale="0.001 0.001 1" opacity="0"
            animation__grow="property: scale; from: 0.001 0.001 1; to: 0.6 0.6 1; dur: 2200; easing: easeOutCubic; startEvents: bloom"
            animation__fade="property: opacity; from: 0; to: 1; dur: 600; easing: easeOutCubic; startEvents: bloom"></a-image>
          <a-image src="peony.png" id="p5" material="transparent: true; alphaTest: 0.05"
            position="0.38 -0.7 0" rotation="0 -5 0" scale="0.001 0.001 1" opacity="0"
            animation__grow="property: scale; from: 0.001 0.001 1; to: 0.55 0.55 1; dur: 2000; easing: easeOutCubic; startEvents: bloom"
            animation__fade="property: opacity; from: 0; to: 1; dur: 550; easing: easeOutCubic; startEvents: bloom"></a-image>
        </a-entity>
      </a-entity>
    </a-scene>

    <script>
      var params = new URLSearchParams(window.location.search);
      var currentCam = params.get('camera') || 'back';

      // Кнопка переключения камеры
      var switchBtn = document.getElementById('switch-cam');
      switchBtn.addEventListener('click', function() {
        var newCam = currentCam === 'front' ? 'back' : 'front';
        window.location.href = window.location.pathname + '?camera=' + newCam;
      });

      // === Контейнер пионов: на фронтальной камере меньше и сдвинут вверх ===
      var container = document.getElementById('container');
      var baseScale = currentCam === 'front' ? 0.65 : 1.0;
      var yOffset = currentCam === 'front' ? 0.25 : 0;
      container.setAttribute('position', '0 ' + yOffset + ' 0');
      container.setAttribute('scale', baseScale + ' ' + baseScale + ' ' + baseScale);

      // === Зеркало: только на фронтальной камере ===
      var mirrorBtn = document.getElementById('mirror-cam');
      var isMirror = false;
      if (currentCam === 'front') {
        mirrorBtn.style.display = 'flex';
      }
      mirrorBtn.addEventListener('click', function() {
        isMirror = !isMirror;
        if (isMirror) {
          document.body.classList.add('flip-scene');
          // Контр-переворот AR-элементов, чтобы пионы не отзеркалились
          container.setAttribute('scale', (-baseScale) + ' ' + baseScale + ' ' + baseScale);
        } else {
          document.body.classList.remove('flip-scene');
          container.setAttribute('scale', baseScale + ' ' + baseScale + ' ' + baseScale);
        }
      });

      // === Конфигурация пионов ===
      var halfOpen = [
        { x: -0.62, y: 0.3, rot: 10, scale: 0.34 },
        { x: 0.6, y: -0.3, rot: -8, scale: 0.32 },
        { x: -0.2, y: -0.98, rot: 5, scale: 0.35 },
        { x: 0.18, y: 0.98, rot: -5, scale: 0.33 },
        { x: 0.68, y: 0.35, rot: -10, scale: 0.34 },
        { x: -0.68, y: -0.15, rot: 8, scale: 0.32 }
      ];
      var opening = [
        { x: 0.55, y: 0.28, rot: -5, scale: 0.52 },
        { x: -0.52, y: -0.28, rot: 8, scale: 0.5 },
        { x: -0.72, y: 0.08, rot: 5, scale: 0.54 },
        { x: 0.7, y: -0.45, rot: -8, scale: 0.48 },
        { x: -0.05, y: -1.0, rot: 3, scale: 0.53 },
        { x: 0.05, y: 1.05, rot: -3, scale: 0.51 }
      ];
      var buds = [
        { x: -0.82, y: 0.45, scale: 0.2 },
        { x: 0.8, y: 0.5, scale: 0.19 },
        { x: -0.5, y: 1.05, scale: 0.21 },
        { x: 0.48, y: -0.95, scale: 0.2 },
        { x: -0.78, y: -0.4, scale: 0.18 },
        { x: 0.82, y: -0.05, scale: 0.22 },
        { x: -0.15, y: -1.12, scale: 0.19 },
        { x: 0.25, y: 1.12, scale: 0.21 },
        { x: -0.88, y: 0.12, scale: 0.17 },
        { x: 0.85, y: 0.18, scale: 0.2 },
        { x: -0.42, y: -1.05, scale: 0.18 },
        { x: 0.42, y: 1.0, scale: 0.19 }
      ];

      var target = document.getElementById('target');
      var hint = document.getElementById('hint');
      var scanOverlay = document.getElementById('scan-overlay');
      var allExtras = [];

      function createPeony(id, src, x, y, rot, scale) {
        var el = document.createElement('a-image');
        el.setAttribute('id', id);
        el.setAttribute('src', src);
        el.setAttribute('material', 'transparent: true; alphaTest: 0.05');
        el.setAttribute('position', x + ' ' + y + ' 0');
        el.setAttribute('rotation', '0 ' + rot + ' 0');
        el.setAttribute('scale', '0.001 0.001 1');
        el.setAttribute('opacity', '0');
        var growDur = 1800 + Math.floor(Math.random() * 1200);
        var fadeDur = 400 + Math.floor(Math.random() * 400);
        el.setAttribute('animation__grow', 'property: scale; from: 0.001 0.001 1; to: ' + scale + ' ' + scale + ' 1; dur: ' + growDur + '; easing: easeOutCubic; startEvents: bloom');
        el.setAttribute('animation__fade', 'property: opacity; from: 0; to: 1; dur: ' + fadeDur + '; easing: easeOutCubic; startEvents: bloom');
        container.appendChild(el);
        return el;
      }

      halfOpen.forEach(function(p, i) { allExtras.push(createPeony('h' + i, 'peony_half.png', p.x, p.y, p.rot, p.scale)); });
      opening.forEach(function(p, i) { allExtras.push(createPeony('o' + i, 'peony_open.png', p.x, p.y, p.rot, p.scale)); });
      buds.forEach(function(p, i) { allExtras.push(createPeony('b' + i, 'peony_bud.png', p.x, p.y, (Math.random() - 0.5) * 20, p.scale)); });

      var mainPeonies = ['p1', 'p2', 'p3', 'p4', 'p5'];
      var origPos = {
        'p1': '0 0 0', 'p2': '-0.38 0.72 0', 'p3': '-0.36 -0.65 0',
        'p4': '0.4 0.75 0', 'p5': '0.38 -0.7 0'
      };

      function resetAll() {
        mainPeonies.forEach(function(id) {
          var p = document.getElementById(id);
          p.setAttribute('scale', '0.001 0.001 1');
          p.setAttribute('opacity', '0');
          p.setAttribute('position', origPos[id]);
        });
        allExtras.forEach(function(p) {
          p.setAttribute('scale', '0.001 0.001 1');
          p.setAttribute('opacity', '0');
        });
      }

      function shuffle(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
        }
        return arr;
      }

      function bloomAll() {
        var allEls = [];
        mainPeonies.forEach(function(id) { allEls.push(document.getElementById(id)); });
        allExtras.forEach(function(p) { allEls.push(p); });
        var shuffled = shuffle(allEls.slice());
        shuffled.forEach(function(el, i) {
          var delay = i * (200 + Math.floor(Math.random() * 300));
          setTimeout(function() { el.emit('bloom'); }, delay);
        });
      }

      // === Дебаунс для scan-overlay, чтобы не мигал ===
      var hideTimer = null;
      var showTimer = null;

      target.addEventListener('targetFound', function() {
        if (showTimer) { clearTimeout(showTimer); showTimer = null; }
        if (!hideTimer) {
          hideTimer = setTimeout(function() {
            hint.classList.add('hidden');
            scanOverlay.classList.add('hidden');
            hideTimer = null;
          }, 250);
        }
        resetAll();
        setTimeout(bloomAll, 100);
      });

      target.addEventListener('targetLost', function() {
        if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
        if (!showTimer) {
          showTimer = setTimeout(function() {
            resetAll();
            hint.classList.remove('hidden');
            scanOverlay.classList.remove('hidden');
            showTimer = null;
          }, 800);
        }
      });
    </script>
  </body>
</html>
