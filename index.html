<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR Photo Zone — Пионы на мху</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- Перехватываем getUserMedia: выбираем камеру из URL -->
    <script>
      (function() {
        const params = new URLSearchParams(window.location.search);
        const cam = params.get('camera') || 'back';
        const facingMode = cam === 'front' ? 'user' : 'environment';

        const original = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
        navigator.mediaDevices.getUserMedia = function(constraints) {
          if (constraints && constraints.video !== undefined && constraints.video !== false) {
            if (typeof constraints.video === 'object' && constraints.video !== null) {
              constraints.video.facingMode = facingMode;
            } else {
              constraints.video = { facingMode: facingMode };
            }
          }
          return original(constraints);
        };
      })();
    </script>

    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }

      #hint {
        position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.6); color: #fff; padding: 12px 24px;
        border-radius: 30px; font-family: -apple-system, sans-serif;
        font-size: 14px; z-index: 100; transition: opacity 0.5s;
        pointer-events: none; text-align: center;
      }
      #hint.hidden { opacity: 0; }

      #switch-cam {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        background: rgba(255,255,255,0.9); color: #333; border: none;
        padding: 14px 28px; border-radius: 30px; font-family: -apple-system, sans-serif;
        font-size: 15px; font-weight: 600; z-index: 100; cursor: pointer;
        box-shadow: 0 2px 12px rgba(0,0,0,0.3); transition: background 0.2s;
      }
      #switch-cam:active { background: rgba(255,255,255,1); }
    </style>
  </head>
  <body>
    <div id="hint">Наведите камеру на метку на мху</div>
    <button id="switch-cam">Переключить камеру</button>

    <a-scene
      mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.0001; filterBeta: 1000; warmupTolerance: 3; missTolerance: 8;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      embedded>

      <a-light type="ambient" intensity="0.7" color="#fff5f0"></a-light>
      <a-light type="directional" position="0 1 2" intensity="0.6" color="#ffffff"></a-light>
      <a-light type="point" position="0.5 0.5 1" intensity="0.25" color="#ffe8e8"></a-light>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">

        <a-image src="peony.png" id="peony1"
          position="0 0.05 0" rotation="0 0 0" scale="0.001 0.001 1" opacity="0"
          animation__grow="property: scale; from: 0.001 0.001 1; to: 0.85 0.85 1; dur: 2500; easing: easeOutElastic; startEvents: bloom"
          animation__fade="property: opacity; from: 0; to: 1; dur: 600; startEvents: bloom"
          animation__sway="property: rotation; from: 0 -2 0; to: 0 2 0; dur: 5000; dir: alternate; loop: true; easing: easeInOutSine; startEvents: sway">
        </a-image>

        <a-image src="peony.png" id="peony2"
          position="-0.42 -0.08 0" rotation="0 18 0" scale="0.001 0.001 1" opacity="0"
          animation__grow="property: scale; from: 0.001 0.001 1; to: 0.55 0.55 1; dur: 2200; easing: easeOutElastic; startEvents: bloom"
          animation__fade="property: opacity; from: 0; to: 1; dur: 500; startEvents: bloom"
          animation__sway="property: rotation; from: 0 15 0; to: 0 22 0; dur: 6000; dir: alternate; loop: true; easing: easeInOutSine; startEvents: sway">
        </a-image>

        <a-image src="peony.png" id="peony3"
          position="0.4 -0.02 0" rotation="0 -16 0" scale="0.001 0.001 1" opacity="0"
          animation__grow="property: scale; from: 0.001 0.001 1; to: 0.5 0.5 1; dur: 2000; easing: easeOutElastic; startEvents: bloom"
          animation__fade="property: opacity; from: 0; to: 1; dur: 450; startEvents: bloom"
          animation__sway="property: rotation; from: 0 -22 0; to: 0 -14 0; dur: 5500; dir: alternate; loop: true; easing: easeInOutSine; startEvents: sway">
        </a-image>

        <a-image src="peony.png" id="peony4"
          position="-0.18 0.35 0" rotation="0 8 0" scale="0.001 0.001 1" opacity="0"
          animation__grow="property: scale; from: 0.001 0.001 1; to: 0.32 0.32 1; dur: 1800; easing: easeOutElastic; startEvents: bloom"
          animation__fade="property: opacity; from: 0; to: 1; dur: 400; startEvents: bloom"
          animation__sway="property: rotation; from: 0 5 0; to: 0 12 0; dur: 7000; dir: alternate; loop: true; easing: easeInOutSine; startEvents: sway">
        </a-image>

        <a-image src="peony.png" id="peony5"
          position="0.22 -0.32 0" rotation="0 -10 0" scale="0.001 0.001 1" opacity="0"
          animation__grow="property: scale; from: 0.001 0.001 1; to: 0.28 0.28 1; dur: 1600; easing: easeOutElastic; startEvents: bloom"
          animation__fade="property: opacity; from: 0; to: 1; dur: 350; startEvents: bloom"
          animation__sway="property: rotation; from: 0 -12 0; to: 0 -6 0; dur: 6500; dir: alternate; loop: true; easing: easeInOutSine; startEvents: sway">
        </a-image>

      </a-entity>
    </a-scene>

    <script>
      // Кнопка переключения камеры
      const switchBtn = document.getElementById('switch-cam');
      const params = new URLSearchParams(window.location.search);
      const currentCam = params.get('camera') || 'back';

      switchBtn.textContent = currentCam === 'front' ? '📷 Обычная камера' : '🤳 Селфи-камера';

      switchBtn.addEventListener('click', () => {
        const newCam = currentCam === 'front' ? 'back' : 'front';
        window.location.href = window.location.pathname + '?camera=' + newCam;
      });

      // Анимация пионов
      const target = document.querySelector('a-entity[mindar-image-target]');
      const hint = document.getElementById('hint');
      const peonies = ['peony1', 'peony2', 'peony3', 'peony4', 'peony5'];
      const delays = [0, 700, 1100, 1600, 2100];
      const origPos = {
        'peony1': '0 0.05 0',
        'peony2': '-0.42 -0.08 0',
        'peony3': '0.4 -0.02 0',
        'peony4': '-0.18 0.35 0',
        'peony5': '0.22 -0.32 0'
      };

      function resetPeonies() {
        peonies.forEach(id => {
          const p = document.getElementById(id);
          if (!p) return;
          p.setAttribute('scale', '0.001 0.001 1');
          p.setAttribute('opacity', '0');
          p.setAttribute('position', origPos[id]);
        });
      }

      function bloomPeonies() {
        peonies.forEach((id, i) => {
          setTimeout(() => {
            const p = document.getElementById(id);
            if (!p) return;
            p.emit('bloom');
            setTimeout(() => p.emit('sway'), 2800);
          }, delays[i]);
        });
      }

      target.addEventListener('targetFound', () => {
        hint.classList.add('hidden');
        resetPeonies();
        setTimeout(bloomPeonies, 100);
      });

      target.addEventListener('targetLost', () => {
        resetPeonies();
        hint.classList.remove('hidden');
      });
    </script>
  </body>
</html>
