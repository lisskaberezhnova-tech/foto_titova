<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR Photo Zone</title>

    <!-- A-Frame: правильное имя файла на CDN -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <!-- MindAR: этот CDN уже работает у вас -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      body { margin: 0; overflow: hidden; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <a-scene
      mindar-image="imageTargetSrc: targets.mind; filterMode: best; enableSmooth: true; smoothCount: 10; smoothFactor: 0.5;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights">

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-image
          id="bouquet-photo"
          src="bouquet-photo.png"
          rotation="0 0 0"
          position="0 -0.6 -0.1"
          scale="0.7 0.7 1">
          <a-animation attribute="position" from="0 -0.6 -0.1" to="0 0 -0.1" dur="1000" easing="ease-out" start-event="markerfound"></a-animation>
          <a-animation attribute="scale" from="0.7 0.7 1" to="1 1 1" dur="900" easing="ease-in" start-event="markerfound"></a-animation>
          <a-animation attribute="opacity" from="0" to="1" dur="700" start-event="markerfound"></a-animation>
        </a-image>
      </a-entity>

    </a-scene>
  </body>
</html>
