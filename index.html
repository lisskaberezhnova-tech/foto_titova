<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR Photo Zone — Пионы</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script>
      (function() {
        var params = new URLSearchParams(window.location.search);
        var cam = params.get('camera') || 'back';
        var facingMode = cam === 'front' ? 'user' : 'environment';
        var original = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
        navigator.mediaDevices.getUserMedia = function(constraints) {
          if (constraints && constraints.video !== undefined && constraints.video !== false) {
            if (typeof constraints.video === 'object' && constraints.video !== null) {
              constraints.video.facingMode = facingMode;
            } else {
              constraints.video = { facingMode: facingMode };
            }
          }
          return original(constraints);
        };
      })();
    </script>

    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      canvas { display: block; width: 100% !important; height: 100% !important; }
      a-scene { width: 100vw !important; height: 100vh !important; display: block; margin: 0 auto; }

      #hint {
        position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.55); color: #fff;
        padding: 7px 20px; border-radius: 18px;
        font-family: -apple-system, sans-serif;
        font-size: 13px; font-weight: 400; line-height: 1;
        white-space: nowrap;
        z-index: 100; transition: opacity 0.5s;
        pointer-events: none; text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      }
      #hint.hidden { opacity: 0; }

      #switch-cam {
        position: fixed; bottom: 30px; right: 25px;
        background: transparent; border: none;
        width: 50px; height: 50px; border-radius: 50%;
        z-index: 100; cursor: pointer;
        box-shadow: 0 3px 12px rgba(0,0,0,0.45);
        transition: all 0.2s;
        display: flex; align-items: center; justify-content: center;
      }
      #switch-cam:active { transform: scale(0.92); }
      #switch-cam svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 2; }

      #mirror-cam {
        position: fixed; bottom: 92px; right: 25px;
        background: transparent; border: none;
        width: 50px; height: 50px; border-radius: 50%;
        z-index: 100; cursor: pointer;
        box-shadow: 0 3px 12px rgba(0,0,0,0.45);
        transition: all 0.2s; display: none;
        align-items: center; justify-content: center;
      }
      #mirror-cam:active { transform: scale(0.92); }
      #mirror-cam svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 2; }

      #photo-btn {
        position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
        background: #fff; border: none;
        width: 64px; height: 64px; border-radius: 50%;
        z-index: 100; cursor: pointer;
        box-shadow: 0 3px 14px rgba(0,0,0,0.4);
        transition: all 0.15s;
        display: flex; align-items: center; justify-content: center;
      }
      #photo-btn:active { transform: translateX(-50%) scale(0.92); }

      #flash {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #fff; opacity: 0; z-index: 200; pointer-events: none;
        transition: opacity 0.25s;
      }
      #flash.flash-on { opacity: 0.9; }

      #scan-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 90; pointer-events: none;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.4s;
      }
      #scan-overlay.hidden { opacity: 0; }
      #scan-plus { width: 48px; height: 48px; position: relative; }
      #scan-plus::before, #scan-plus::after {
        content: ''; position: absolute; background: rgba(255,255,255,0.6);
      }
      #scan-plus::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
      #scan-plus::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
    </style>
  </head>
  <body>
    <div id="hint">Наведите камеру на метку</div>
    <div id="scan-overlay"><div id="scan-plus"></div></div>
    <div id="flash"></div>

    <button id="photo-btn"></button>

    <button id="switch-cam">
      <svg viewBox="0 0 24 24">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path>
        <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"></path>
      </svg>
    </button>

    <button id="mirror-cam">
      <svg viewBox="0 0 24 24">
        <path d="M12 3v18"></path>
        <path d="M8 7L4 12l4 5"></path>
        <path d="M16 7l4 5-4 5"></path>
      </svg>
    </button>

    <a-scene
      mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 10; uiScanning: no; uiLoading: no; uiError: no;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights: true, preserveDrawingBuffer: true">

      <a-light type="ambient" intensity="0.7" color="#fff5f0"></a-light>
      <a-light type="directional" position="0 1 2" intensity="0.6" color="#ffffff"></a-light>
      <a-light type="point" position="0.5 0.5 1" intensity="0.25" color="#ffe8e8"></a-light>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0" id="target">
        <a-entity id="container"></a-entity>
      </a-entity>
    </a-scene>

    <script>
      var params = new URLSearchParams(window.location.search);
      var currentCam = params.get('camera') || 'back';

      var switchBtn = document.getElementById('switch-cam');
      switchBtn.addEventListener('click', function() {
        var newCam = currentCam === 'front' ? 'back' : 'front';
        window.location.href = window.location.pathname + '?camera=' + newCam;
      });

      var mirrorBtn = document.getElementById('mirror-cam');
      var isMirror = false;
      if (currentCam === 'front') {
        mirrorBtn.style.display = 'flex';
      }

      function applyMirror() {
        var videoEl = document.querySelector('video');
        if (videoEl) {
          videoEl.style.transform = isMirror ? 'scaleX(-1)' : 'none';
        }
        var canvases = document.querySelectorAll('a-scene canvas, .a-canvas');
        var container = document.getElementById('container');
        if (canvases.length > 0) {
          canvases[0].style.transform = isMirror ? 'scaleX(-1)' : 'none';
          container.setAttribute('scale', isMirror ? '-1 1 1' : '1 1 1');
        }
      }

      mirrorBtn.addEventListener('click', function() {
        isMirror = !isMirror;
        applyMirror();
      });

      // === Фото ===
      var photoBtn = document.getElementById('photo-btn');
      var flashEl = document.getElementById('flash');

      photoBtn.addEventListener('click', function() {
        flashEl.classList.add('flash-on');
        setTimeout(function() { flashEl.classList.remove('flash-on'); }, 250);

        requestAnimationFrame(function() {
          requestAnimationFrame(function() {
            var canvas3d = document.querySelector('a-scene canvas') || document.querySelector('.a-canvas');
            var videoEl = document.querySelector('video');
            if (!canvas3d) return;

            var w = canvas3d.width;
            var h = canvas3d.height;

            var outCanvas = document.createElement('canvas');
            outCanvas.width = w;
            outCanvas.height = h;
            var ctx = outCanvas.getContext('2d');

            function drawMirror(fn) {
              if (isMirror) {
                ctx.save();
                ctx.translate(w, 0);
                ctx.scale(-1, 1);
                fn();
                ctx.restore();
              } else {
                fn();
              }
            }

            // Видео — фон
            if (videoEl && videoEl.videoWidth > 0) {
              var vw = videoEl.videoWidth;
              var vh = videoEl.videoHeight;
              var scale = Math.max(w / vw, h / vh);
              var dw = vw * scale;
              var dh = vh * scale;
              var dx = (w - dw) / 2;
              var dy = (h - dh) / 2;
              drawMirror(function() {
                ctx.drawImage(videoEl, dx, dy, dw, dh);
              });
            }

            // AR поверх
            drawMirror(function() {
              ctx.drawImage(canvas3d, 0, 0, w, h);
            });

            try {
              var dataURL = outCanvas.toDataURL('image/png');
              var link = document.createElement('a');
              link.download = 'ar-photo-' + Date.now() + '.png';
              link.href = dataURL;
              link.click();
            } catch(e) {
              console.error('Photo capture error:', e);
            }
          });
        });
      });

      // =====================================================
      // АСИММЕТРИЧНАЯ АРКА ИЗ ПИОНОВ
      // Левая сторона — выше и гуще, правая — ниже и легче
      // =====================================================

      // 5 основных открытых пионов — каркас арки
      var mainConfig = [
        // Макушка арки, чуть левее центра
        { id: 'p1', src: 'peony.png',   x: -0.15, y: 1.25,  rot: -3,  scale: 1.0,  dur: 800, fade: 300 },
        // Левая сторона, верх
        { id: 'p2', src: 'peony.png',   x: -0.85, y: 1.05,  rot: 8,   scale: 0.72, dur: 700, fade: 280 },
        // Левая сторона, ниже ( арка спускается)
        { id: 'p3', src: 'peony.png',   x: -1.15, y: 0.45,  rot: 12,  scale: 0.6,  dur: 650, fade: 260 },
        // Правая сторона, верх — ниже левой
        { id: 'p4', src: 'peony.png',   x: 0.55,  y: 0.95,  rot: -8,  scale: 0.65, dur: 600, fade: 240 },
        // Правая сторона, ниже — арка спускается ниже
        { id: 'p5', src: 'peony.png',   x: 0.9,   y: 0.35,  rot: -12, scale: 0.52, dur: 550, fade: 220 }
      ];

      // 6 полураскрытых — заполняют арку
      var halfOpen = [
        // Левая ветвь (гуще)
        { x: -0.5,  y: 1.35, rot: 5,   scale: 0.38 },
        { x: -1.0,  y: 0.75, rot: 10,  scale: 0.36 },
        { x: -1.25, y: 0.05, rot: 15,  scale: 0.34 },
        // Правая ветвь (легче)
        { x: 0.25,  y: 1.2,  rot: -5,  scale: 0.36 },
        { x: 0.7,   y: 0.65, rot: -10, scale: 0.34 },
        { x: 1.0,   y: 0.0,  rot: -15, scale: 0.3 },
      ];

      // 6 раскрывающихся — средний размер
      var opening = [
        // Левая ветвь
        { x: -0.35, y: 0.95,  rot: 3,   scale: 0.5 },
        { x: -0.75, y: 0.5,   rot: 8,   scale: 0.48 },
        { x: -1.05, y: 0.85,  rot: 6,   scale: 0.46 },
        // Правая ветвь
        { x: 0.4,   y: 0.5,   rot: -3,  scale: 0.48 },
        { x: 0.65,  y: 0.15,  rot: -8,  scale: 0.44 },
        { x: 0.15,  y: 0.75,  rot: 0,   scale: 0.46 }
      ];

      // 12 бутонов — россыпь по арке, самые маленькие
      var buds = [
        // Левая ветвь (больше бутонов)
        { x: -0.7,  y: 1.45, scale: 0.22 },
        { x: -1.1,  y: 1.2,  scale: 0.2 },
        { x: -1.3,  y: 0.75, scale: 0.19 },
        { x: -1.35, y: 0.2,  scale: 0.18 },
        { x: -0.55, y: 1.1,  scale: 0.21 },
        { x: -0.95, y: 0.3,  scale: 0.19 },
        { x: -0.2,  y: 1.5,  scale: 0.2 },
        // Правая ветвь (меньше бутонов)
        { x: 0.45,  y: 1.3,  scale: 0.2 },
        { x: 0.8,   y: 0.85, scale: 0.19 },
        { x: 1.05,  y: 0.55, scale: 0.18 },
        { x: 1.1,   y: -0.1, scale: 0.17 },
        { x: 0.3,   y: 0.95, scale: 0.2 }
      ];

      var container = document.getElementById('container');
      var target = document.getElementById('target');
      var hint = document.getElementById('hint');
      var scanOverlay = document.getElementById('scan-overlay');
      var allPeonies = [];
      var origPos = {};

      function createPeony(id, src, x, y, rot, baseScale, growDur, fadeDur) {
        var el = document.createElement('a-image');
        el.setAttribute('id', id);
        el.setAttribute('src', src);
        el.setAttribute('material', 'transparent: true; alphaTest: 0.1');
        var posStr = x + ' ' + y + ' 0';
        el.setAttribute('position', posStr);
        el.setAttribute('rotation', '0 ' + rot + ' 0');
        el.setAttribute('scale', '0.001 0.001 1');
        el.setAttribute('opacity', '0');
        el.setAttribute('animation__grow',
          'property: scale; from: 0.001 0.001 1; to: ' + baseScale + ' ' + baseScale + ' 1; dur: ' + growDur + '; easing: easeOutCubic; startEvents: bloom');
        el.setAttribute('animation__fade',
          'property: opacity; from: 0; to: 1; dur: ' + fadeDur + '; easing: easeOutCubic; startEvents: bloom');
        container.appendChild(el);
        allPeonies.push(el);
        origPos[id] = posStr;
        return el;
      }

      mainConfig.forEach(function(p) {
        createPeony(p.id, p.src, p.x, p.y, p.rot, p.scale, p.dur, p.fade);
      });
      halfOpen.forEach(function(p, i) {
        createPeony('h' + i, 'peony_half.png', p.x, p.y, p.rot, p.scale, 500 + Math.floor(Math.random() * 200), 200 + Math.floor(Math.random() * 100));
      });
      opening.forEach(function(p, i) {
        createPeony('o' + i, 'peony_open.png', p.x, p.y, p.rot, p.scale, 550 + Math.floor(Math.random() * 200), 220 + Math.floor(Math.random() * 100));
      });
      buds.forEach(function(p, i) {
        var rot = (Math.random() - 0.5) * 20;
        createPeony('b' + i, 'peony_bud.png', p.x, p.y, rot, p.scale, 400 + Math.floor(Math.random() * 200), 180 + Math.floor(Math.random() * 100));
      });

      // =====================================================
      // СВЕРКАНИЕ — росинка/роса на пионах
      // =====================================================

      // Генерируем sparkle-точку как data-URI (звёздочка с мягким свечением)
      var sparkleSVG = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">' +
        '<defs><radialGradient id="g" cx="50%" cy="50%" r="50%">' +
        '<stop offset="0%" stop-color="#fff" stop-opacity="1"/>' +
        '<stop offset="20%" stop-color="#fff8e0" stop-opacity="0.9"/>' +
        '<stop offset="100%" stop-color="#fff8e0" stop-opacity="0"/>' +
        '</radialGradient></defs>' +
        '<circle cx="32" cy="32" r="14" fill="url(#g)"/>' +
        '<path d="M32 6 L34 30 L58 32 L34 34 L32 58 L30 34 L6 32 L30 30 Z" fill="#fff" opacity="0.85"/>' +
        '</svg>';
      var sparkleDataURI = 'data:image/svg+xml;base64,' + btoa(sparkleSVG);

      // Позиции сверкающих точек — вдоль арки, возле пионов
      var sparklePositions = [
        // Левая ветвь
        { x: -0.12, y: 1.22 }, { x: -0.3, y: 1.4 }, { x: -0.6, y: 1.15 },
        { x: -0.88, y: 0.95 }, { x: -1.1, y: 0.6 }, { x: -1.2, y: 0.3 },
        { x: -0.45, y: 0.85 }, { x: -0.75, y: 0.4 }, { x: -1.0, y: 1.0 },
        { x: -0.2, y: 1.55 }, { x: -0.55, y: 1.5 },
        // Правая ветвь
        { x: 0.5, y: 0.9 }, { x: 0.75, y: 0.55 }, { x: 0.95, y: 0.25 },
        { x: 0.3, y: 1.15 }, { x: 0.6, y: 0.35 }, { x: 0.2, y: 0.7 },
        { x: 0.45, y: 1.35 }, { x: 0.85, y: 0.7 }, { x: 1.05, y: 0.1 },
        // Доп. точки в центре арки
        { x: 0.0, y: 1.1 }, { x: -0.05, y: 0.8 }, { x: 0.1, y: 1.3 }
      ];

      var sparkles = [];

      sparklePositions.forEach(function(pos, i) {
        var el = document.createElement('a-image');
        el.setAttribute('id', 'spark' + i);
        el.setAttribute('src', sparkleDataURI);
        el.setAttribute('material', 'transparent: true; opacity: 0');
        el.setAttribute('position', pos.x + ' ' + pos.y + ' 0.01');
        var sparkSize = 0.06 + Math.random() * 0.06;
        el.setAttribute('scale', sparkSize + ' ' + sparkSize + ' 1');

        // Две фазы мигания: появление + исчезновение
        var twinkleDur = 800 + Math.floor(Math.random() * 1200);
        var pauseDur = 600 + Math.floor(Math.random() * 2000);

        el.setAttribute('animation__twinkleIn',
          'property: material.opacity; from: 0; to: 0.9; dur: ' + twinkleDur + '; easing: easeOutCubic; startEvents: twinkle');
        el.setAttribute('animation__twinkleOut',
          'property: material.opacity; from: 0.9; to: 0; dur: ' + twinkleDur + '; delay: ' + twinkleDur + '; easing: easeInCubic; startEvents: twinkle');

        // Лёгкое увеличение при появлении
        el.setAttribute('animation__pulse',
          'property: scale; from: ' + (sparkSize * 0.5) + ' ' + (sparkSize * 0.5) + ' 1; to: ' + sparkSize + ' ' + sparkSize + ' 1; dur: ' + twinkleDur + '; easing: easeOutCubic; startEvents: twinkle');

        container.appendChild(el);
        sparkles.push({ el: el, pauseDur: pauseDur, twinkleDur: twinkleDur });
      });

      var sparkleTimers = [];
      var sparkleActive = false;

      function scheduleSparkle(spark, index) {
        if (!sparkleActive) return;
        var delay = Math.random() * spark.pauseDur;
        var timer = setTimeout(function() {
          if (!sparkleActive) return;
          spark.el.emit('twinkle');
          // Следующий цикл
          scheduleSparkle(spark, index);
        }, delay);
        sparkleTimers.push(timer);
      }

      function startSparkles() {
        sparkleActive = true;
        sparkles.forEach(function(spark, i) {
          scheduleSparkle(spark, i);
        });
      }

      function stopSparkles() {
        sparkleActive = false;
        sparkleTimers.forEach(function(t) { clearTimeout(t); });
        sparkleTimers = [];
        sparkles.forEach(function(spark) {
          spark.el.setAttribute('material', 'opacity', '0');
        });
      }

      // =====================================================
      // СБРОС И ПОЯВЛЕНИЕ
      // =====================================================

      function resetAll() {
        allPeonies.forEach(function(el) {
          el.setAttribute('scale', '0.001 0.001 1');
          el.setAttribute('opacity', '0');
          el.setAttribute('position', origPos[el.getAttribute('id')]);
        });
        stopSparkles();
      }

      function shuffle(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
        }
        return arr;
      }

      function bloomAll() {
        var shuffled = shuffle(allPeonies.slice());
        var totalMs = 1000;
        var step = totalMs / shuffled.length;
        shuffled.forEach(function(el, i) {
          var delay = Math.floor(i * step + Math.random() * (step * 0.5));
          setTimeout(function() { el.emit('bloom'); }, delay);
        });
        // Запускаем сверкание через 1.2 сек (после появления пионов)
        setTimeout(startSparkles, 1200);
      }

      var hideTimer = null;
      var showTimer = null;

      target.addEventListener('targetFound', function() {
        if (showTimer) { clearTimeout(showTimer); showTimer = null; }
        if (!hideTimer) {
          hideTimer = setTimeout(function() {
            hint.classList.add('hidden');
            scanOverlay.classList.add('hidden');
            hideTimer = null;
          }, 250);
        }
        resetAll();
        setTimeout(bloomAll, 100);
      });

      target.addEventListener('targetLost', function() {
        if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
        if (!showTimer) {
          showTimer = setTimeout(function() {
            resetAll();
            hint.classList.remove('hidden');
            scanOverlay.classList.remove('hidden');
            showTimer = null;
          }, 800);
        }
      });
    </script>
  </body>
</html>
