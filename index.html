<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR Photo Zone — Пионы</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <script>
      (function() {
        const params = new URLSearchParams(window.location.search);
        const cam = params.get('camera') || 'back';
        const facingMode = cam === 'front' ? 'user' : 'environment';

        const original = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
        navigator.mediaDevices.getUserMedia = function(constraints) {
          if (constraints && constraints.video !== undefined && constraints.video !== false) {
            if (typeof constraints.video === 'object' && constraints.video !== null) {
              constraints.video.facingMode = facingMode;
            } else {
              constraints.video = { facingMode: facingMode };
            }
          }
          return original(constraints);
        };
      })();
    </script>

    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      canvas { display: block; width: 100% !important; height: 100% !important; }
      a-scene { width: 100vw !important; height: 100vh !important; }

      #hint {
        position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.6); color: #fff; padding: 10px 18px;
        border-radius: 24px; font-family: -apple-system, sans-serif;
        font-size: 14px; z-index: 100; transition: opacity 0.5s;
        pointer-events: none; text-align: center;
      }
      #hint.hidden { opacity: 0; }

      #switch-cam {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        background: rgba(255,255,255,0.9); border: none;
        width: 56px; height: 56px; border-radius: 50%;
        z-index: 100; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        transition: all 0.2s;
        display: flex; align-items: center; justify-content: center;
      }
      #switch-cam:active {
        background: #fff; transform: translateX(-50%) scale(0.95);
      }
      #switch-cam svg {
        width: 28px; height: 28px;
      }
    </style>
  </head>
  <body>
    <div id="hint">Наведите камеру на метку</div>

    <!-- Кнопка: чистый значок кругового вращения -->
    <button id="switch-cam">
      <svg viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path>
        <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"></path>
      </svg>
    </button>

    <a-scene
      mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.00001; filterBeta: 10000; warmupTolerance: 5; missTolerance: 10;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights">

      <a-light type="ambient" intensity="0.7" color="#fff5f0"></a-light>
      <a-light type="directional" position="0 1 2" intensity="0.6" color="#ffffff"></a-light>
      <a-light type="point" position="0.5 0.5 1" intensity="0.25" color="#ffe8e8"></a-light>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">

        <!-- Пион 1 — центр, самый большой -->
        <a-image src="peony.png" id="peony1" material="transparent: true; alphaTest: 0.1"
          position="0 0 0" rotation="0 0 0" scale="0.001 0.001 1" opacity="0"
          animation__grow="property: scale; from: 0.001 0.001 1; to: 1.3 1.3 1; dur: 3000; easing: easeOutCubic; startEvents: bloom"
          animation__fade="property: opacity; from: 0; to: 1; dur: 800; easing: easeOutCubic; startEvents: bloom">
        </a-image>

        <!-- Пион 2 — выше центра -->
        <a-image src="peony.png" id="peony2" material="transparent: true; alphaTest: 0.1"
          position="0.08 0.7 0" rotation="0 5 0" scale="0.001 0.001 1" opacity="0"
          animation__grow="property: scale; from: 0.001 0.001 1; to: 0.9 0.9 1; dur: 2600; easing: easeOutCubic; startEvents: bloom"
          animation__fade="property: opacity; from: 0; to: 1; dur: 700; easing: easeOutCubic; startEvents: bloom">
        </a-image>

        <!-- Пион 3 — ниже центра -->
        <a-image src="peony.png" id="peony3" material="transparent: true; alphaTest: 0.1"
          position="-0.1 -0.68 0" rotation="0 -5 0" scale="0.001 0.001 1" opacity="0"
          animation__grow="property: scale; from: 0.001 0.001 1; to: 0.85 0.85 1; dur: 2400; easing: easeOutCubic; startEvents: bloom"
          animation__fade="property: opacity; from: 0; to: 1; dur: 650; easing: easeOutCubic; startEvents: bloom">
        </a-image>

        <!-- Пион 4 — наверху, поменьше -->
        <a-image src="peony.png" id="peony4" material="transparent: true; alphaTest: 0.1"
          position="-0.12 1.25 0" rotation="0 8 0" scale="0.001 0.001 1" opacity="0"
          animation__grow="property: scale; from: 0.001 0.001 1; to: 0.55 0.55 1; dur: 2200; easing: easeOutCubic; startEvents: bloom"
          animation__fade="property: opacity; from: 0; to: 1; dur: 600; easing: easeOutCubic; startEvents: bloom">
        </a-image>

        <!-- Пион 5 — внизу, поменьше -->
        <a-image src="peony.png" id="peony5" material="transparent: true; alphaTest: 0.1"
          position="0.12 -1.2 0" rotation="0 -8 0" scale="0.001 0.001 1" opacity="0"
          animation__grow="property: scale; from: 0.001 0.001 1; to: 0.5 0.5 1; dur: 2000; easing: easeOutCubic; startEvents: bloom"
          animation__fade="property: opacity; from: 0; to: 1; dur: 550; easing: easeOutCubic; startEvents: bloom">
        </a-image>

      </a-entity>
    </a-scene>

    <script>
      const switchBtn = document.getElementById('switch-cam');
      const params = new URLSearchParams(window.location.search);
      const currentCam = params.get('camera') || 'back';

      switchBtn.addEventListener('click', () => {
        const newCam = currentCam === 'front' ? 'back' : 'front';
        window.location.href = window.location.pathname + '?camera=' + newCam;
      });

      const target = document.querySelector('a-entity[mindar-image-target]');
      const hint = document.getElementById('hint');
      const peonies = ['peony1', 'peony2', 'peony3', 'peony4', 'peony5'];
      const delays = [0, 800, 1400, 2100, 2700];
      const origPos = {
        'peony1': '0 0 0',
        'peony2': '0.08 0.7 0',
        'peony3': '-0.1 -0.68 0',
        'peony4': '-0.12 1.25 0',
        'peony5': '0.12 -1.2 0'
      };

      function resetPeonies() {
        peonies.forEach(id => {
          const p = document.getElementById(id);
          if (!p) return;
          p.setAttribute('scale', '0.001 0.001 1');
          p.setAttribute('opacity', '0');
          p.setAttribute('position', origPos[id]);
        });
      }

      function bloomPeonies() {
        peonies.forEach((id, i) => {
          setTimeout(() => {
            const p = document.getElementById(id);
            if (!p) return;
            p.emit('bloom');
          }, delays[i]);
        });
      }

      target.addEventListener('targetFound', () => {
        hint.classList.add('hidden');
        resetPeonies();
        setTimeout(bloomPeonies, 100);
      });

      target.addEventListener('targetLost', () => {
        resetPeonies();
        hint.classList.remove('hidden');
      });
    </script>
  </body>
</html>
