<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR Арка из пионов</title>

    <!-- Подключаем A-Frame и MindAR -->
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
      canvas { display: block; width: 100% !important; height: 100% !important; }
      a-scene { width: 100vw !important; height: 100vh !important; display: block; margin: 0 auto; }

      /* Подсказка: «наведите на метку» */
      #hint {
        position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
        background: rgba(0,0,0,0.55); color: #fff;
        padding: 8px 16px; border-radius: 12px;
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 13px; font-weight: 400; line-height: 1;
        white-space: nowrap; z-index: 100;
        pointer-events: none; text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      }
      #hint.hidden { opacity: 0; transition: opacity 0.4s ease; }

      /* Крестик-прицел для сканирования */
      #scan-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 90; pointer-events: none;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.4s;
      }
      #scan-overlay.hidden { opacity: 0; }
      #scan-plus { width: 48px; height: 48px; position: relative; }
      #scan-plus::before, #scan-plus::after {
        content: ''; position: absolute; background: rgba(255,255,255,0.6);
      }
      #scan-plus::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
      #scan-plus::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
    </style>
  </head>
  <body>
    <!-- Интерфейс -->
    <div id="hint">Наведите камеру на метку</div>
    <div id="scan-overlay"><div id="scan-plus"></div></div>

    <!-- Сцена AR -->
    <a-scene
      mindar-image="imageTargetSrc: targets.mind; filterMinCF: 0.001; filterBeta: 0.01; warmupTolerance: 5; missTolerance: 10; uiScanning: no; uiLoading: no; uiError: no;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      color-space="sRGB"
      renderer="colorManagement: true, preserveDrawingBuffer: true, antialias: false, powerPreference: 'low-power'">

      <!-- Освещение (минимум, чтобы картинка не была чёрной) -->
      <a-light type="ambient" intensity="0.8" color="#fff5f0"></a-light>
      <a-light type="directional" position="0 1 2" intensity="0.5" color="#ffffff"></a-light>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Метка + Арка (одна картинка) -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-image
          src="arch_peonies.png"
          position="0 0.15 0"
          rotation="0 0 0"
          scale="1.1 1.1 1"
          material="transparent: true; alphaTest: 0.01; side: double">
        </a-image>
      </a-entity>
    </a-scene>

    <!-- Логика подсказок -->
    <script>
      const hint = document.getElementById('hint');
      const overlay = document.getElementById('scan-overlay');
      const targetEl = document.querySelector('[mindar-image-target]');

      if (targetEl) {
        targetEl.addEventListener('targetFound', () => {
          hint.classList.add('hidden');
          overlay.classList.add('hidden');
        });

        targetEl.addEventListener('targetLost', () => {
          setTimeout(() => {
            hint.classList.remove('hidden');
            overlay.classList.remove('hidden');
          }, 800);
        });
      }
    </script>
  </body>
</html>
